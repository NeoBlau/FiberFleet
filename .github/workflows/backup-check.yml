name: Backup checks
on:
  pull_request:
  push:
    branches: [fix/full-backup-restore]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check server/routes/admin.js
      - run: npm run build
      - run: node --test server/test/backup.test.js
