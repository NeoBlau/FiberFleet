# /etc/nginx/sites-available/fiberfleet
# Замените fleet.example.ru на свой домен. HTTPS добавит certbot (см. DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name fleet.example.ru;

    client_max_body_size 25m;          # импорт номенклатуры из 1С

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # формирование больших отчётов
    }
}
